spring.application.name=PulseOps Backend

# ---- Default datasource: H2 (zero-setup, works out of the box) ----
spring.datasource.url=${DATASOURCE_URL:jdbc:h2:file:./data/pulseops;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATASOURCE_USERNAME:sa}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ---- To use MySQL instead, run with: --spring.profiles.active=mysql ----
# See application-mysql.properties (credentials via MYSQL_USER / MYSQL_PASSWORD)

# ---- JWT (override in production via environment) ----
app.jwt.secret=${JWT_SECRET:0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Monitoring scheduler ----
app.monitoring.enabled=${MONITORING_ENABLED:true}
app.monitoring.fixed-delay-ms=${MONITORING_FIXED_DELAY_MS:60000}
app.monitoring.timeout-ms=${MONITORING_TIMEOUT_MS:8000}

# ---- CORS (frontend dev server) ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- Bootstrap admin (override in production via environment) ----
app.seed.admin-name=${ADMIN_NAME:Demo Operator}
app.seed.admin-email=${ADMIN_EMAIL:admin@pulseops.io}
app.seed.admin-password=${ADMIN_PASSWORD:Admin@123}

server.port=${SERVER_PORT:8080}
springdoc.swagger-ui.path=/swagger-ui.html
